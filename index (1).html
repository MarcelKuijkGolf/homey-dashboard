<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energie thuis</title>
<!-- 24-10-2026 MK Nest Hub dashboard energie en auto -->
<!-- 25-10-2026 MK saldo dag/maand/jaar, nieuwe grafiek, kopen/verkopen/sparen -->
<!-- 25-10-2026 MK ring vloeit bij laden/leveren, label auto warm -->
<style>
  :root {
    --bg: #0d1117;
    --tile: #161b22;
    --tile2: #1c2330;
    --line: #2a3340;
    --text: #e6edf3;
    --muted: #8b949e;
    --laden: #4c8dff;
    --verkopen: #3fb950;
    --eco: #6e7681;
    --vast: #d29922;
    --leeg: #da3633;
    --warm: #f0b429;
    --kopen: #f0883e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%; overflow: hidden;
  }
  .app {
    display: grid; height: 100vh; padding: 14px; gap: 12px;
    grid-template-columns: 1.15fr 1fr 0.9fr;
    grid-template-rows: auto 1fr 1.05fr;
    grid-template-areas:
      "top top top"
      "batt nu car"
      "chart chart klimaat";
  }
  .tile {
    background: var(--tile); border-radius: 18px;
    padding: 14px 18px; min-height: 0; position: relative;
  }
  .top {
    grid-area: top; display: flex; align-items: baseline;
    justify-content: space-between; padding: 0 6px;
  }
  .klok { font-size: 44px; font-weight: 600; letter-spacing: -1px; }
  .datum { color: var(--muted); font-size: 18px; margin-left: 12px; }
  .topr { display: flex; gap: 22px; align-items: baseline;
    color: var(--muted); font-size: 18px; }
  .topr b { color: var(--text); font-size: 26px; font-weight: 600; }
  .label { color: var(--muted); font-size: 14px;
    text-transform: uppercase; letter-spacing: 1px; }

  /* batterij */
  .batt { grid-area: batt; display: flex; gap: 16px; align-items: center; }
  .ring { width: 150px; height: 150px; flex: none; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .pct {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .ring .pct b { font-size: 42px; font-weight: 700; }
  .ring .pct span { font-size: 13px; color: var(--muted); }
  .battinfo { min-width: 0; }
  /* stroom door de ring: met de klok mee bij laden, terug bij leveren */
  #stroom { display: none; }
  .laadt #stroom, .levert #stroom { display: block;
    animation: vloei 1.1s linear infinite; }
  .levert #stroom { animation-direction: reverse; }
  @keyframes vloei { from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -24; } }
  .laadt #ringval, .levert #ringval {
    filter: drop-shadow(0 0 4px currentColor); }
  .chip {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    font-weight: 700; font-size: 20px; margin: 6px 0 8px;
  }
  .battinfo .sub { color: var(--muted); font-size: 16px; line-height: 1.35; }

  /* nu */
  .nu { grid-area: nu; display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; padding: 12px; background: transparent; }
  .mini { background: var(--tile); border-radius: 16px; padding: 12px 14px;
    min-width: 0; }
  .mini b { display: block; font-size: 30px; font-weight: 700;
    margin-top: 4px; white-space: nowrap; }
  .mini small { color: var(--muted); font-size: 14px; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dagsub { font-size: 12px; line-height: 1.3; }
  .mini b#dagsaldo { margin-top: 2px; }

  /* auto */
  .auto { grid-area: car; display: flex; flex-direction: column; gap: 8px; }
  .auto .soc { font-size: 46px; font-weight: 700; line-height: 1; }
  .bar { height: 12px; background: var(--tile2); border-radius: 99px;
    overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px;
    background: var(--verkopen); }
  .rij { display: flex; justify-content: space-between;
    font-size: 17px; padding: 6px 0; border-top: 1px solid var(--line); }
  .rij span:first-child { color: var(--muted); }
  .rij b { font-size: 19px; }

  /* klimaat */
  .klimaat { grid-area: klimaat; display: flex; flex-direction: column;
    gap: 8px; }
  .kamer { display: flex; justify-content: space-between;
    align-items: baseline; }
  .kamer .t { font-size: 40px; font-weight: 700; }
  .kamer .n { color: var(--muted); font-size: 16px; }
  .kamer small { display: block; color: var(--muted); font-size: 14px; }
  .doel { color: var(--warm); }

  /* grafieken */
  .chart { grid-area: chart; display: flex; flex-direction: column; }
  .chartkop { display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 6px; gap: 10px; }
  .legenda { display: flex; gap: 12px; font-size: 13px;
    color: var(--muted); white-space: nowrap; margin-left: auto; }
  .legenda i { display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .stip { display: flex; gap: 6px; align-self: center; }
  .stip i { width: 7px; height: 7px; border-radius: 50%;
    background: var(--line); }
  .stip i.aan { background: var(--muted); }
  .grafiek { flex: 1; min-height: 0; width: 100%; display: none; }
  .grafiek.aan { display: block; }

  .alarm { position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    background: var(--leeg); color: #fff; font-weight: 700;
    font-size: 22px; text-align: center; padding: 10px;
    display: none; }
  .melding { position: fixed; bottom: 6px; right: 14px;
    font-size: 12px; color: var(--muted); }

  @media (min-width: 1200px) {
    .klok { font-size: 56px; }
    .ring { width: 190px; height: 190px; }
    .ring .pct b { font-size: 54px; }
    .mini b { font-size: 38px; }
    .auto .soc { font-size: 60px; }
    .kamer .t { font-size: 50px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><span class="klok" id="klok">--:--</span>
      <span class="datum" id="datum"></span></div>
    <div class="topr">
      <span>Buiten <b id="temp">-</b></span>
      <span>Stroom nu <b id="prijs">-</b></span>
    </div>
  </div>

  <div class="tile batt">
    <div class="ring">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none"
          stroke="#2a3340" stroke-width="12"/>
        <defs><mask id="vulmask">
          <circle id="maskval" cx="60" cy="60" r="52" fill="none"
            stroke="#fff" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
        </mask></defs>
        <circle id="ringval" cx="60" cy="60" r="52" fill="none"
          stroke="#3fb950" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
        <circle id="stroom" cx="60" cy="60" r="52" fill="none"
          stroke="rgba(255,255,255,0.6)" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="6 18"
          mask="url(#vulmask)"/>
      </svg>
      <div class="pct"><b id="soc">-</b><span>thuisbatterij</span></div>
    </div>
    <div class="battinfo">
      <div class="label">Plan nu</div>
      <div class="chip" id="chip">-</div>
      <div class="sub" id="volgende"></div>
      <div class="sub" id="echt"></div>
    </div>
  </div>

  <div class="tile nu">
    <div class="mini"><small id="netlabel">Net</small><b id="net">-</b>
      <small id="netsub"></small></div>
    <div class="mini"><small>Zon</small><b id="zon">-</b>
      <small>opwek nu</small></div>
    <div class="mini"><small>Batterij</small><b id="bpow">-</b>
      <small id="bsub"></small></div>
    <div class="mini"><small id="dagkop">Vandaag</small><b id="dagsaldo">-</b>
      <small id="dagsub"></small></div>
  </div>

  <div class="tile auto">
    <div class="label">Niro</div>
    <div class="soc" id="nirosoc">-</div>
    <div class="bar"><i id="nirobar" style="width:0"></i></div>
    <div>
      <div class="rij"><span>Lader</span><span id="lader">-</span></div>
      <div class="rij"><span>Laadmodus</span><span id="laadmodus">-</span></div>
      <div class="rij"><span id="vertreksub">Warm om</span>
        <b id="vertrek">06:20</b></div>
    </div>
  </div>

  <div class="tile klimaat">
    <div class="label">Binnen</div>
    <div class="kamer">
      <div><div class="n">Woonkamer</div>
        <small id="woonsub">-</small></div>
      <div class="t" id="woon">-</div>
    </div>
    <div class="rij" id="bovenlijn" style="padding:0"></div>
    <div class="kamer" id="bovenrij">
      <div><div class="n">Boven</div></div>
      <div class="t" id="boven">-</div>
    </div>
  </div>

  <div class="tile chart">
    <div class="chartkop">
      <div class="label" id="charttitel">Stroomprijs en batterijplan</div>
      <div class="legenda" id="legenda"></div>
      <div class="stip"><i id="stip0" class="aan"></i><i id="stip1"></i></div>
    </div>
    <svg id="g0" class="grafiek aan" preserveAspectRatio="none"></svg>
    <svg id="g1" class="grafiek" preserveAspectRatio="none"></svg>
  </div>
</div>
<div class="alarm" id="alarm">Thuisbatterij heeft geen net. Kijk in de meterkast.</div>
<div class="melding" id="melding"></div>

<script>
// 24-10-2026 MK instellingen komen uit de link: #homey=ID&key=SLEUTEL
// 25-10-2026 MK ook ?h=ID:SLEUTEL voor casten zonder # en &
const P = new URLSearchParams(location.hash.slice(1));
const Q = new URLSearchParams(location.search);
let HOMEY = P.get('homey') || Q.get('homey');
let KEY = P.get('key') || Q.get('key');
const H = Q.get('h') || P.get('h');
if (H && H.includes(':')) {
  HOMEY = H.split(':')[0];
  KEY = H.split(':').slice(1).join(':');
}
const VAR_NAAM = P.get('var') || Q.get('var') || 'Dashboard data';
const VERVERS_MS = 60000;
const WISSEL_MS = 15000;

const KLEUR = { L: '--laden', V: '--verkopen', E: '--eco',
  H: '--vast', X: '--kopen' };
const NAAM = { L: 'Inkopen', V: 'Verkopen', E: 'Eco',
  H: 'Sparen', X: 'Kopen' };
const css = n => getComputedStyle(document.documentElement)
  .getPropertyValue(n).trim();
const eur = v => (v < 0 ? '- ' : '') + '€ '
  + Math.abs(Number(v)).toFixed(2).replace('.', ',');
const kw = w => (Math.abs(w) / 1000).toFixed(1).replace('.', ',') + ' kW';
const $ = id => document.getElementById(id);

function klok() {
  const d = new Date();
  $('klok').textContent = d.toLocaleTimeString('nl-NL',
    { hour: '2-digit', minute: '2-digit' });
  $('datum').textContent = d.toLocaleDateString('nl-NL',
    { weekday: 'long', day: 'numeric', month: 'long' });
}
setInterval(klok, 10000); klok();

// voorbeeldgegevens als er geen sleutel in de link staat
function demo() {
  const plan = [];
  const nu = new Date(); nu.setMinutes(0, 0, 0);
  for (let i = 0; i < 30; i++) {
    const t = new Date(nu.getTime() + i * 3600000);
    const h = t.getHours();
    let p = 0.17 + 0.02 * Math.sin(i / 3), m = 'E';
    if (h >= 12 && h < 15) { p = 0.13; m = 'L'; }
    if (h >= 17 && h < 20) { p = 0.29; m = 'V'; }
    if (h >= 23 || h < 6) { p = 0.14; m = 'H'; }
    plan.push({ u: String(h).padStart(2, '0') + ':00',
      d: t.toISOString().substring(0, 10), p, m });
  }
  const jaar = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep',
    'okt','nov','dec'].map((m, i) => ({ m,
      s: i < 10 ? [-62, -41, -12, 18, 46, 61, 58, 44, 12, -9][i] : null,
      nu: i === 9 }));
  return { t: new Date().toISOString(), soc: 87, bW: 450, sW: 0,
    gW: -20, m: 'E', advies: 'Eco (€ 0,24) | 23:00 Sparen',
    prijs: 0.24, temp: 10.4, niro: 62,
    dag: { kopen: 1.12, verkopen: 0.48, kwhIn: 6.4, kwhUit: 2.1,
      saldo: -0.64 },
    maand: { kopen: 31.2, verkopen: 22.4, kwhIn: 180, kwhUit: 90,
      saldo: -8.8 },
    jaar, jaarNu: String(new Date().getFullYear()), jaarSaldo: 115,
    lader: 'Aangesloten', laadmodus: 'uit', later: false,
    woon: { t: 20.5, doel: 21, modus: 'verwarmen' }, boven: 18.9, plan };
}

async function haal() {
  if (!HOMEY || !KEY) return demo();
  const url = 'https://' + HOMEY
    + '.connect.athom.com/api/manager/logic/variable/';
  const r = await fetch(url, {
    headers: { Authorization: 'Bearer ' + KEY } });
  if (!r.ok) throw new Error('Homey ' + r.status);
  const vars = await r.json();
  const v = Object.values(vars).find(x => x.name === VAR_NAAM);
  if (!v) throw new Error('Variabele "' + VAR_NAAM + '" niet gevonden');
  return JSON.parse(v.value);
}

function teken(d) {
  // batterij
  const soc = Math.round(d.soc || 0);
  $('soc').textContent = soc + '%';
  $('ringval').style.strokeDashoffset = 326.7 * (1 - soc / 100);
  $('maskval').style.strokeDashoffset = 326.7 * (1 - soc / 100);
  $('ringval').style.stroke = soc < 20 ? css('--leeg')
    : soc < 40 ? css('--kopen') : css('--verkopen');
  const m = d.m || 'E';
  $('chip').textContent = NAAM[m] || m;
  $('chip').style.background = css(KLEUR[m] || '--eco');
  $('chip').style.color = m === 'E' ? '#fff' : '#0d1117';
  const delen = String(d.advies || '').split('|');
  $('volgende').textContent = delen[1] ? 'Daarna ' + delen[1].trim() : '';
  if (d.gW == null) d.gW = 0;
  if (d.bW == null) d.bW = 0;
  if (d.sW == null) d.sW = 0;
  $('echt').textContent = d.bW > 100 ? 'Levert nu ' + kw(d.bW)
    : d.bW < -100 ? 'Laadt nu ' + kw(d.bW) : 'Batterij in rust';
  // GivEnergy: + is leveren (ontladen), - is laden
  const ring = document.querySelector('.ring');
  ring.classList.toggle('laadt', d.bW < -100);
  ring.classList.toggle('levert', d.bW > 100);
  $('ringval').style.color = $('ringval').style.stroke;

  // net: kopen of verkopen
  if (d.gW > 100) {
    $('netlabel').textContent = 'Verkopen';
    $('net').textContent = kw(d.gW);
    $('net').style.color = css('--verkopen');
    $('netsub').textContent = 'aan het net';
  } else if (d.gW < -100) {
    $('netlabel').textContent = 'Kopen';
    $('net').textContent = kw(d.gW);
    $('net').style.color = css('--kopen');
    $('netsub').textContent = 'van het net';
  } else {
    $('netlabel').textContent = 'Net';
    $('net').textContent = 'balans';
    $('net').style.color = css('--text');
    $('netsub').textContent = 'niets van of naar net';
  }
  $('zon').textContent = d.sW > 50 ? kw(d.sW) : '0 kW';
  $('zon').style.color = d.sW > 50 ? css('--warm') : css('--muted');
  $('bpow').textContent = Math.abs(d.bW) < 100 ? 'rust' : kw(d.bW);
  $('bsub').textContent = d.bW > 100 ? 'levert stroom'
    : d.bW < -100 ? 'laden' : '';

  // vandaag
  if (d.dag) {
    const s = d.dag.saldo;
    $('dagkop').textContent = s >= 0 ? 'Vandaag winst' : 'Vandaag kosten';
    $('dagsaldo').textContent = eur(Math.abs(s));
    $('dagsaldo').style.color = s >= 0 ? css('--verkopen') : css('--kopen');
    $('dagsub').innerHTML = 'kopen ' + eur(d.dag.kopen)
      + '<br>verkopen ' + eur(d.dag.verkopen);
  }
  $('alarm').style.display = d.vanNet ? 'block' : 'none';
  $('prijs').textContent = d.prijs != null ? eur(d.prijs) : '-';
  $('temp').textContent = d.temp != null
    ? String(Math.round(d.temp * 10) / 10).replace('.', ',') + '°' : '-';

  // auto
  $('nirosoc').textContent = d.niro != null ? Math.round(d.niro) + '%' : '-';
  $('nirobar').style.width = (d.niro || 0) + '%';
  $('nirobar').style.background = d.niro < 40 ? css('--kopen')
    : css('--verkopen');
  $('lader').textContent = d.lader || '-';
  $('laadmodus').textContent = d.laadmodus || '-';
  $('vertrek').textContent = d.later ? '07:20' : '06:20';
  const dagW = new Date().getHours() < 7 ? 'vandaag' : 'morgen';
  $('vertreksub').textContent = 'Auto warm ' + dagW + ' om';

  // binnen
  const graad = v => v == null ? '-'
    : String(Math.round(v * 10) / 10).replace('.', ',') + '°';
  const w = d.woon || {};
  $('woon').textContent = graad(w.t);
  $('woonsub').innerHTML = w.doel != null ? 'Nest op <span class="doel">'
    + graad(w.doel) + '</span>' + (w.modus ? ', ' + w.modus : '')
    + (w.weg ? ' (offline)' : '') : '';
  $('boven').textContent = graad(d.boven);
  $('bovenrij').style.display = d.boven == null ? 'none' : 'flex';
  $('bovenlijn').style.display = d.boven == null ? 'none' : 'flex';

  grafieken();
  const oud = (Date.now() - new Date(d.t).getTime()) / 60000;
  $('melding').textContent = HOMEY ? (oud > 10
    ? 'Let op: gegevens zijn ' + Math.round(oud) + ' min oud' : '')
    : 'Voorbeeldgegevens';
}

// ---------- grafiek 1: prijs per uur met plan ----------
function maat(svg) {
  const W = svg.clientWidth || 800;
  const Hh = svg.clientHeight || 200;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
  return [W, Hh];
}
function prijsGrafiek(plan) {
  const svg = $('g0');
  const [W, Hh] = maat(svg);
  if (!plan.length) { svg.innerHTML = ''; return; }
  const links = 40, onder = 22, boven = 22;
  const pr = plan.map(p => p.p);
  const max = Math.max(...pr), min = Math.min(...pr);
  const top = Math.ceil(max * 1.08 * 20) / 20;
  const bodem = Math.max(0, Math.floor(min * 0.85 * 20) / 20);
  const bw = (W - links) / plan.length;
  const y = v => boven + (Hh - onder - boven)
    * (1 - (v - bodem) / ((top - bodem) || 1));
  let s = '<defs>';
  for (const k of Object.keys(KLEUR)) {
    s += '<linearGradient id="gr' + k + '" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="' + css(KLEUR[k]) + '"/>'
      + '<stop offset="1" stop-color="' + css(KLEUR[k])
      + '" stop-opacity="0.2"/></linearGradient>';
  }
  s += '</defs>';
  // rasterlijnen met prijs
  const stap = (top - bodem) > 0.25 ? 0.1 : 0.05;
  for (let v = bodem; v <= top + 0.0001; v += stap) {
    const yy = y(v);
    s += '<line x1="' + links + '" x2="' + W + '" y1="' + yy + '" y2="'
      + yy + '" stroke="' + css('--line') + '"/>'
      + '<text x="' + (links - 6) + '" y="' + (yy + 4) + '" fill="'
      + css('--muted') + '" font-size="11" text-anchor="end">'
      + v.toFixed(2).replace('.', ',') + '</text>';
  }
  // gemiddelde
  const gem = pr.reduce((a, b) => a + b, 0) / pr.length;
  s += '<line x1="' + links + '" x2="' + W + '" y1="' + y(gem) + '" y2="'
    + y(gem) + '" stroke="' + css('--muted')
    + '" stroke-dasharray="4 4"/><text x="' + (W - 2) + '" y="'
    + (y(gem) - 4) + '" fill="' + css('--muted')
    + '" font-size="11" text-anchor="end">gem '
    + gem.toFixed(2).replace('.', ',') + '</text>';
  const iMax = pr.indexOf(max), iMin = pr.indexOf(min);
  plan.forEach((p, i) => {
    const x = links + i * bw;
    const yy = y(p.p);
    s += '<rect x="' + (x + bw * 0.14) + '" y="' + yy + '" width="'
      + (bw * 0.72) + '" height="' + Math.max(2, y(bodem) - yy)
      + '" rx="4" fill="url(#gr' + (KLEUR[p.m] ? p.m : 'E') + ')"/>';
    if (i > 0 && p.u === '00:00') {
      s += '<line x1="' + x + '" x2="' + x + '" y1="' + (boven - 6)
        + '" y2="' + (Hh - onder) + '" stroke="' + css('--muted')
        + '" stroke-dasharray="2 4"/><text x="' + (x + 4) + '" y="'
        + (boven - 8) + '" fill="' + css('--muted')
        + '" font-size="11">morgen</text>';
    }
    if (i % 3 === 0) {
      s += '<text x="' + (x + bw / 2) + '" y="' + (Hh - 5) + '" fill="'
        + css('--muted') + '" font-size="12" text-anchor="middle">'
        + p.u + '</text>';
    }
    if (i === iMax || i === iMin) {
      s += '<text x="' + (x + bw / 2) + '" y="' + (yy - 5) + '" fill="'
        + css('--text') + '" font-size="12" font-weight="700"'
        + ' text-anchor="middle">' + p.p.toFixed(2).replace('.', ',')
        + '</text>';
    }
  });
  // nu-markering binnen het eerste uur
  const xn = links + bw * (new Date().getMinutes() / 60);
  s += '<line x1="' + xn + '" x2="' + xn + '" y1="' + (boven - 6)
    + '" y2="' + (Hh - onder) + '" stroke="#fff" stroke-width="2"/>'
    + '<text x="' + (xn + 4) + '" y="' + (boven - 8)
    + '" fill="#fff" font-size="11" font-weight="700">nu</text>';
  svg.innerHTML = s;
}

// ---------- grafiek 2: kosten en winst per maand ----------
function saldoGrafiek(d) {
  const svg = $('g1');
  const [W, Hh] = maat(svg);
  const j = d.jaar || [];
  if (!j.length) { svg.innerHTML = ''; return; }
  const onder = 22, boven = 18;
  const ext = Math.max(10, ...j.map(x => Math.abs(x.s || 0))) * 1.2;
  const y0 = boven + (Hh - onder - boven) / 2;
  const sc = (Hh - onder - boven) / 2 / ext;
  const bw = W / j.length;
  let s = '<line x1="0" x2="' + W + '" y1="' + y0 + '" y2="' + y0
    + '" stroke="' + css('--line') + '"/>';
  j.forEach((x, i) => {
    const cx = i * bw + bw / 2;
    if (x.s != null) {
      const h = Math.max(2, Math.abs(x.s) * sc);
      const yy = x.s >= 0 ? y0 - h : y0;
      s += '<rect x="' + (i * bw + bw * 0.18) + '" y="' + yy + '" width="'
        + (bw * 0.64) + '" height="' + h + '" rx="4" fill="'
        + css(x.s >= 0 ? '--verkopen' : '--kopen') + '" opacity="'
        + (x.nu ? 1 : 0.8) + '"' + (x.nu
          ? ' stroke="#fff" stroke-width="2"' : '') + '/>';
      const ty = x.s >= 0 ? yy - 5 : yy + h + 13;
      s += '<text x="' + cx + '" y="' + ty + '" fill="' + css('--text')
        + '" font-size="12" text-anchor="middle">'
        + (x.s >= 0 ? '+' : '-') + Math.round(Math.abs(x.s)) + '</text>';
    }
    s += '<text x="' + cx + '" y="' + (Hh - 5) + '" fill="'
      + css(x.nu ? '--text' : '--muted') + '" font-size="12"'
      + ' text-anchor="middle"' + (x.nu ? ' font-weight="700"' : '')
      + '>' + x.m + '</text>';
  });
  svg.innerHTML = s;
}

// ---------- wisselen tussen de grafieken ----------
let scherm = 0;
let laatste = null;
function grafieken() {
  $('g0').classList.toggle('aan', scherm === 0);
  $('g1').classList.toggle('aan', scherm === 1);
  $('stip0').classList.toggle('aan', scherm === 0);
  $('stip1').classList.toggle('aan', scherm === 1);
  const d = laatste || {};
  if (scherm === 0) {
    $('charttitel').textContent = 'Stroomprijs en batterijplan';
    $('legenda').innerHTML = ['L', 'V', 'E', 'H'].map(k =>
      '<span><i style="background:var(' + KLEUR[k] + ')"></i>'
      + NAAM[k].toLowerCase() + '</span>').join('');
    prijsGrafiek(d.plan || []);
  } else {
    $('charttitel').textContent = 'Kosten en winst ' + (d.jaarNu || '');
    $('legenda').innerHTML = 'deze maand <b style="color:var('
      + ((d.maand && d.maand.saldo >= 0) ? '--verkopen' : '--kopen')
      + ')">&nbsp;' + (d.maand ? eur(d.maand.saldo) : '-')
      + '</b>&nbsp;&nbsp;dit jaar <b style="color:var('
      + (d.jaarSaldo >= 0 ? '--verkopen' : '--kopen') + ')">&nbsp;'
      + (d.jaarSaldo != null ? eur(d.jaarSaldo) : '-') + '</b>';
    saldoGrafiek(d);
  }
}

async function ververs() {
  try {
    laatste = await haal();
    teken(laatste);
  } catch (e) {
    $('melding').textContent = 'Geen verbinding: ' + e.message;
  }
}
setInterval(() => { scherm = 1 - scherm; grafieken(); }, WISSEL_MS);
window.addEventListener('resize', () => laatste && teken(laatste));
ververs();
setInterval(ververs, VERVERS_MS);
</script>
